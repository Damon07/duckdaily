---
layout: default
title: 日报归档
permalink: /archive/
---
<section class="page-heading"><p class="eyebrow">THE ARCHIVE</p><h1>每日记录，持续积累。</h1><p class="intro">日期对应报道覆盖的北京时间自然日。</p></section>
<div class="archive">{% for post in site.posts %}<article><time datetime="{{ post.date | date: '%Y-%m-%d' }}">{{ post.date | date: '%Y.%m.%d' }}</time><h2><a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a></h2></article>{% else %}<p class="empty">还没有已发布日报。</p>{% endfor %}</div>
